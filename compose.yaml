services:
  backend:
    build: ./backend
    # Configuração e segredos: .env na raiz (modelo em .env.example).
    env_file: .env
    volumes:
      # Código e db.sqlite3 do host: runserver recarrega ao editar.
      - ./backend:/app
      - /app/venv
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"
