services:
  backend:
    build: ./backend
    environment:
      DJANGO_DEBUG: "1"
      # "backend" é o host que o nginx do frontend usa no proxy.
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,backend"
    volumes:
      # Código e db.sqlite3 do host: runserver recarrega ao editar.
      - ./backend:/app
      - /app/venv
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"
